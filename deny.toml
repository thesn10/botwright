[graph]
all-features = false
features = ["mempool", "hypersync", "bundles", "telegram", "metrics", "http", "test-util"]

[advisories]
version = 2
yanked = "warn"
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2025-0143", reason = "capnp, only through hypersync-client; no fixed release it accepts" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5, only through k256 in alloy; signing keys stay local" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
