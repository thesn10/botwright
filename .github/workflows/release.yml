name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead of a bump (e.g. 0.3.0-rc.1)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: release only from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::releases run from master, not $GITHUB_REF_NAME"
          exit 1
      - uses: actions/checkout@v4
      - run: ci/release.sh check

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  tag:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: prepare
        run: echo "version=$(ci/release.sh prepare "$BUMP")" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.version || inputs.bump }}
      - name: commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:refs/heads/master "v$VERSION"
        env:
          VERSION: ${{ steps.prepare.outputs.version }}

  publish:
    needs: tag
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      TOKEN_SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.TOKEN_SECRET == ''
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.TOKEN_SECRET || steps.auth.outputs.token }}

  github-release:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
      - run: |
          ci/release.sh notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          prerelease=()
          if [[ $VERSION == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
